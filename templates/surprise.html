
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Redwan ♡</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali&family=Noto+Naskh+Arabic&family=Noto+Sans+JP&family=Noto+Sans+KR&family=Noto+Sans+SC&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #050505;
    overflow: hidden;
    color: white;
    font-family: Georgia, serif;
}

h1 {
    position: absolute;
    top: 5%;
    width: 100%;
    text-align: center;
    color: #f5dce7;
    font-size: clamp(20px, 4vw, 32px);
    font-weight: normal;
    letter-spacing: 2px;
    padding: 0 10px;
}

p {
    position: absolute;
    bottom: 5%;
    width: 100%;
    text-align: center;
    color: #c7aab8;
    letter-spacing: 2px;
    font-size: 12px;
}

canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<h1>For you, in every language ♡</h1>

<canvas id="heart"></canvas>

<p>15 languages. One feeling. ♡</p>

<script>

const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

const words = [
    "I love you",
    "আমি তোমাকে ভালোবাসি",
    "أحبك",
    "Te amo",
    "Je t'aime",
    "Ich liebe dich",
    "Ti amo",
    "Seni seviyorum",
    "میں تم سے محبت کرتا ہوں",
    "愛してる",
    "사랑해",
    "我爱你",
    "Я тебя люблю",
    "Σ' αγαπώ",
    "Aku cinta kamu"
];

const font = '"Noto Sans Bengali", "Noto Naskh Arabic", "Noto Sans JP", "Noto Sans KR", "Noto Sans SC", Arial, sans-serif';

let particles = [];
let W, H, scale;

const rtlWords = [
    "أحبك",
    "میں تم سے محبت کرتا ہوں"
];

// Mathematical heart curve
function heartPoint(t) {
    return {
        x: 16 * Math.pow(Math.sin(t), 3),

        y: 13 * Math.cos(t)
           - 5 * Math.cos(2 * t)
           - 2 * Math.cos(3 * t)
           - Math.cos(4 * t)
    };
}

// Create accurate heart boundary
function makePolygon() {
    const points = [];

    for (let i = 0; i <= 2000; i++) {
        const t = (i / 2000) * Math.PI * 2;
        const point = heartPoint(t);

        points.push({
            x: point.x / 16,
            y: point.y / 17
        });
    }

    return points;
}

const polygon = makePolygon();

function resize() {

    scale = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * scale;
    canvas.height = H * scale;

    ctx.setTransform(scale, 0, 0, scale, 0, 0);

    createHeart();
}

// Find where the heart crosses a horizontal line
function getIntervals(y) {

    const intersections = [];

    for (let i = 0; i < polygon.length - 1; i++) {

        const a = polygon[i];
        const b = polygon[i + 1];

        if (
            (a.y <= y && b.y > y) ||
            (b.y <= y && a.y > y)
        ) {

            const x = a.x +
                (y - a.y) * (b.x - a.x) / (b.y - a.y);

            intersections.push(x);
        }
    }

    intersections.sort((a, b) => a - b);

    const intervals = [];

    for (let i = 0; i + 1 < intersections.length; i += 2) {

        intervals.push([
            intersections[i],
            intersections[i + 1]
        ]);
    }

    return intervals;
}

// Fit complete phrases into each row
function packRow(intervalWidth, index, fontSize, gap) {

    const result = [];

    let used = 0;
    let currentIndex = index;

    ctx.font = `${fontSize}px ${font}`;

    while (true) {

        let selected = null;

        for (let attempt = 0; attempt < words.length; attempt++) {

            const candidate =
                words[(currentIndex + attempt) % words.length];

            const measured = ctx.measureText(candidate).width;

            const spacing = result.length ? gap : 0;

            if (used + spacing + measured <= intervalWidth) {

                selected = {
                    text: candidate,
                    width: measured
                };

                currentIndex =
                    (currentIndex + attempt + 1) % words.length;

                used += spacing + measured;

                break;
            }
        }

        if (!selected) break;

        result.push(selected);
    }

    return {
        result,
        used,
        nextIndex: currentIndex
    };
}

function createHeart() {

    particles = [];

    const mobile = W < 500;

    const heartW = Math.min(W * 0.90, 620);
    const heartH = Math.min(H * 0.72, 520);

    const centerX = W / 2;
    const centerY = H / 2;

    const minY = -1;
    const maxY = 12 / 17;
    const middleY = (minY + maxY) / 2;

    const fontSize = mobile ? 11 : 14;
    const rowGap = mobile ? 24 : 30;
    const wordGap = mobile ? 10 : 15;

    ctx.font = `${fontSize}px ${font}`;

    const step = (2 * rowGap) / heartH;

    let wordIndex = 0;

    // Move from the top of the heart to the bottom
    for (
        let y = maxY - step / 2;
        y > minY;
        y -= step
    ) {

        const intervals = getIntervals(y);

        for (const interval of intervals) {

            const left = interval[0];
            const right = interval[1];

            const intervalWidth =
                (right - left) * heartW / 2;

            if (intervalWidth < 25) continue;

            const packed = packRow(
                intervalWidth,
                wordIndex,
                fontSize,
                wordGap
            );

            if (packed.result.length === 0) continue;

            wordIndex = packed.nextIndex;

            // Centre each row inside its own heart section
            let x = (left + right) / 2 * heartW / 2
                    + centerX - packed.used / 2;

            packed.result.forEach(word => {

                const targetX = x + word.width / 2;

                const targetY =
                    centerY - (y - middleY) * heartH / 2;

                particles.push({

                    text: word.text,

                    x: targetX,
                    y: targetY,

                    startX: Math.random() * W,
                    startY: Math.random() * H,

                    delay: Math.random() * 1200
                });

                x += word.width + wordGap;
            });
        }
    }
}

function ease(t) {
    return 1 - Math.pow(1 - t, 3);
}

function animate(time) {

    ctx.clearRect(0, 0, W, H);

    const mobile = W < 500;
    const fontSize = mobile ? 11 : 14;

    ctx.font = `${fontSize}px ${font}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    particles.forEach(p => {

        const progress = Math.max(
            0,
            Math.min(1, (time - p.delay) / 2200)
        );

        const eased = ease(progress);

        const x = p.startX +
            (p.x - p.startX) * eased;

        const y = p.startY +
            (p.y - p.startY) * eased;

        ctx.direction = rtlWords.includes(p.text)
            ? "rtl"
            : "ltr";

        ctx.fillStyle =
            `rgba(255, 225, 238, ${0.3 + eased * 0.7})`;

        ctx.fillText(p.text, x, y);
    });

    requestAnimationFrame(animate);
}

async function start() {

    if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
    }

    resize();

    requestAnimationFrame(animate);
}

window.addEventListener("resize", resize);

start();

</script>

</body>
</html>
