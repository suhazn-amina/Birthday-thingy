<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Redwan ♡</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali&family=Noto+Naskh+Arabic&family=Noto+Sans+JP&family=Noto+Sans+SC&family=Noto+Sans+KR&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #050505;
    overflow: hidden;
    color: white;
    font-family: Georgia, serif;
}

h1 {
    position: absolute;
    top: 5%;
    width: 100%;
    text-align: center;
    color: #f5dce7;
    font-size: clamp(20px, 4vw, 32px);
    font-weight: normal;
    letter-spacing: 2px;
    padding: 0 10px;
}

p {
    position: absolute;
    bottom: 5%;
    width: 100%;
    text-align: center;
    color: #c7aab8;
    letter-spacing: 2px;
    font-size: 12px;
}

canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<h1>For you, in every language ♡</h1>
<canvas id="heart"></canvas>
<p>15 languages. One feeling. ♡</p>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

const words = [
    "I love you",
    "আমি তোমাকে ভালোবাসি",
    "أحبك",
    "Te amo",
    "Je t'aime",
    "Ich liebe dich",
    "Ti amo",
    "Seni seviyorum",
    "میں تم سے محبت کرتا ہوں",
    "愛してる",
    "사랑해",
    "我爱你",
    "Я тебя люблю",
    "Σ' αγαπώ",
    "Aku cinta kamu"
];

const font = '"Noto Sans Bengali", "Noto Naskh Arabic", "Noto Sans JP", "Noto Sans SC", "Noto Sans KR", Arial, sans-serif';

let particles = [];
let W, H, scale;

function heartPoint(t) {
    return {
        x: 16 * Math.pow(Math.sin(t), 3),
        y: 13 * Math.cos(t)
           - 5 * Math.cos(2*t)
           - 2 * Math.cos(3*t)
           - Math.cos(4*t)
    };
}

function resize() {
    scale = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * scale;
    canvas.height = H * scale;

    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    createHeart();
}

function createHeart() {
    particles = [];

    const mobile = W < 500;
    const heartW = Math.min(W * 0.90, 590);
    const heartH = Math.min(H * 0.59, 440);

    const centerX = W / 2;
    const centerY = H / 2 + 5;

    const fontSize = mobile ? 11 : 14;
    const rowGap = mobile ? 23 : 29;
    const wordGap = mobile ? 10 : 15;

    ctx.font = `${fontSize}px ${font}`;

    const rows = Math.floor(heartH / rowGap);
    let wordIndex = 0;

    for (let r = 0; r <= rows; r++) {
        const normalizedY = -1 + (2 * r / rows);

        let minX = Infinity;
        let maxX = -Infinity;

        // Find the actual left and right edges
        // of the heart at this height.
        for (let i = 0; i <= 1200; i++) {
            const t = (i / 1200) * Math.PI * 2;
            const point = heartPoint(t);

            const y = point.y / 17;
            const x = point.x / 17;

            if (Math.abs(y - normalizedY) < 0.012) {
                minX = Math.min(minX, x);
                maxX = Math.max(maxX, x);
            }
        }

        if (!Number.isFinite(minX) || maxX - minX < 0.12) {
            continue;
        }

        const left = centerX + minX * heartW;
        const right = centerX + maxX * heartW;
        const available = right - left;

        const rowWords = [];
        let used = 0;

        // Pack complete phrases without overlapping.
        while (true) {
            const phrase = words[wordIndex % words.length];
            const phraseWidth = ctx.measureText(phrase).width;
            const extra = phraseWidth +
                (rowWords.length ? wordGap : 0);

            if (used + extra > available) break;

            rowWords.push({
                text: phrase,
                width: phraseWidth
            });

            used += extra;
            wordIndex++;
        }

        if (!rowWords.length) continue;

        let x = centerX - used / 2;

        rowWords.forEach(word => {
            const targetX = x + word.width / 2;
            const targetY = centerY - normalizedY * heartH;

            particles.push({
                text: word.text,
                x: targetX,
                y: targetY,
                startX: Math.random() * W,
                startY: Math.random() * H,
                delay: Math.random() * 1500
            });

            x += word.width + wordGap;
        });
    }
}

function ease(t) {
    return 1 - Math.pow(1 - t, 3);
}

function animate(time) {
    ctx.clearRect(0, 0, W, H);

    const mobile = W < 500;
    const fontSize = mobile ? 11 : 14;

    ctx.font = `${fontSize}px ${font}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    particles.forEach(p => {
        const progress = Math.max(
            0,
            Math.min(1, (time - p.delay) / 2500)
        );

        const eased = ease(progress);

        const x = p.startX + (p.x - p.startX) * eased;
        const y = p.startY + (p.y - p.startY) * eased;

        ctx.fillStyle =
            `rgba(255, 225, 238, ${0.3 + eased * 0.7})`;

        ctx.fillText(p.text, x, y);
    });

    requestAnimationFrame(animate);
}

window.addEventListener("resize", resize);

resize();
requestAnimationFrame(animate);

</script>
</body>
</html>
